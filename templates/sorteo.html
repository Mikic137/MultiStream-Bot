<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script src="/static/flujo.js"></script>
  <title>Sorteo OBS Overlay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@700;900&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Rajdhani', Arial, sans-serif;
      color: #fff;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .wheel-wrap {
      position: relative;
      width: 520px;
      height: 520px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#wheel {
      width: 520px;
      height: 520px;
      border-radius: 50%;
      box-shadow: 0 0 35px rgba(0, 0, 0, 0.8), 0 0 25px rgba(255, 181, 45, 0.5);
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 36px solid #ffd45e;
      filter: drop-shadow(0 4px 8px #000);
      z-index: 10;
      transition: transform 0.05s ease;
    }
    .pointer.tick {
      transform: translateX(-50%) scale(1.2) translateY(-3px);
    }

    .wheel-center {
      position: absolute;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #2a3b61 0%, #0d1222 100%);
      border: 4px solid #ffd45e;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.9);
      z-index: 8;
      color: #ffd45e;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 1px;
    }
    .wheel-center small {
      font-size: 9px;
      color: #fff;
    }

    /* BANNER DE GANADOR */
    .winner-card {
      margin-top: 24px;
      background: linear-gradient(135deg, rgba(20, 28, 50, 0.95) 0%, rgba(10, 14, 26, 0.95) 100%);
      border: 3px solid #ffd45e;
      border-radius: 14px;
      padding: 16px 36px;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 181, 45, 0.6), 0 10px 25px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(20px) scale(0.9);
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }
    .winner-card.show {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .winner-eyebrow {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      color: #ffd45e;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .winner-name {
      font-size: 38px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 3px 12px rgba(0,0,0,0.9);
      margin: 4px 0;
    }
    .winner-prize {
      font-size: 18px;
      color: #38bdf8;
      font-weight: 700;
    }

    canvas#confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

<canvas id="confetti"></canvas>

<div id="container">
  <div class="wheel-wrap">
    <div class="pointer" id="pointer"></div>
    <canvas id="wheel" width="880" height="880"></canvas>
    <div class="wheel-center">
      <span>SORTEO</span>
      <small>LIVE</small>
    </div>
  </div>

  <div class="winner-card" id="winnerCard">
    <div class="winner-eyebrow">🎉 ¡GANADOR DEL SORTEO! 🎉</div>
    <div class="winner-name" id="winnerName">...</div>
    <div class="winner-prize" id="winnerPrize">Cofre de Streamloots 🎁</div>
  </div>
</div>

<script>
const es = new Flujo("sorteo");
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const pointer = document.getElementById("pointer");
const winnerCard = document.getElementById("winnerCard");

let participantes = [];
let anguloActual = 0;
let girando = false;
let audioCtx = null;

const COLORES = [
  "#f43f5e", "#fb923c", "#facc15", "#4ade80",
  "#2dd4bf", "#38bdf8", "#818cf8", "#c084fc",
  "#f472b6", "#fb7185", "#34d399", "#a78bfa"
];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playTick() {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "triangle";
    osc.frequency.setValueAtTime(800 + Math.random() * 200, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.04);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.04);
  } catch(e) {}
}

function playVictory() {
  if (!audioCtx) return;
  try {
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);
      }, i * 110);
    });
  } catch(e) {}
}

function dibujarRuleta() {
  const w = canvas.width;
  const centro = w / 2;
  const radio = centro - 16;
  ctx.clearRect(0, 0, w, w);

  if (!participantes.length) {
    ctx.fillStyle = "#162035";
    ctx.beginPath();
    ctx.arc(centro, centro, radio, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#2d3e66";
    ctx.lineWidth = 12;
    ctx.stroke();

    ctx.fillStyle = "#8a9bbd";
    ctx.font = "bold 36px 'Rajdhani', sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("Esperando participantes...", centro, centro);
    return;
  }

  const n = participantes.length;
  const slice = (Math.PI * 2) / n;

  ctx.save();
  ctx.translate(centro, centro);
  ctx.rotate(anguloActual);

  participantes.forEach((p, i) => {
    const a1 = i * slice;
    const a2 = a1 + slice;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radio, a1, a2);
    ctx.closePath();
    ctx.fillStyle = COLORES[i % COLORES.length];
    ctx.fill();

    ctx.strokeStyle = "#101626";
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();
    ctx.rotate(a1 + slice / 2);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "#000000";
    ctx.shadowBlur = 6;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;

    const fontSize = Math.min(32, Math.max(18, 380 / n + 12));
    ctx.font = `bold ${fontSize}px 'Rajdhani', sans-serif`;

    const textoCortado = p.length > 18 ? p.substring(0, 16) + "…" : p;
    ctx.fillText(textoCortado, radio - 32, 0);
    ctx.restore();
  });

  ctx.restore();
  ctx.beginPath();
  ctx.arc(centro, centro, radio, 0, Math.PI * 2);
  ctx.strokeStyle = "#ffd45e";
  ctx.lineWidth = 10;
  ctx.stroke();
}

let ultimoSliceIdx = -1;
function animarGiro(indiceGanador, duracionMs = 6000, callback) {
  initAudio();
  girando = true;
  winnerCard.classList.remove("show");

  const n = participantes.length;
  const sliceRad = (Math.PI * 2) / n;
  const vueltasCompletas = 6 + Math.floor(Math.random() * 3);
  const anguloObjetivo = (Math.random() * 0.6 + 0.2) * sliceRad;
  const targetAngle = (Math.PI * 2 * vueltasCompletas) + (Math.PI * 1.5) - (indiceGanador * sliceRad + anguloObjetivo);

  const startAngle = anguloActual % (Math.PI * 2);
  const totalDelta = targetAngle - startAngle;
  const startTime = performance.now();

  function frame(now) {
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / duracionMs);
    const ease = 1 - Math.pow(1 - progress, 4);
    anguloActual = startAngle + totalDelta * ease;

    const normalizedAngle = ((-anguloActual - Math.PI / 2) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    const currentSlice = Math.floor(normalizedAngle / sliceRad) % n;

    if (currentSlice !== ultimoSliceIdx) {
      ultimoSliceIdx = currentSlice;
      playTick();
      pointer.classList.add("tick");
      setTimeout(() => pointer.classList.remove("tick"), 50);
    }

    dibujarRuleta();

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      girando = false;
      playVictory();
      lanzarConfetti();
      if (callback) callback();
    }
  }
  requestAnimationFrame(frame);
}

// Confetti
const confCanvas = document.getElementById("confetti");
const confCtx = confCanvas.getContext("2d");
let confettiParticles = [];
function resizeConf() {
  confCanvas.width = window.innerWidth;
  confCanvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeConf);
resizeConf();

function lanzarConfetti() {
  confettiParticles = [];
  for (let i = 0; i < 100; i++) {
    confettiParticles.push({
      x: confCanvas.width / 2,
      y: confCanvas.height / 2,
      vx: (Math.random() - 0.5) * 18,
      vy: (Math.random() - 0.8) * 20,
      color: COLORES[Math.floor(Math.random() * COLORES.length)],
      size: Math.random() * 8 + 6,
      alpha: 1
    });
  }
  function update() {
    confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
    let alive = false;
    confettiParticles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.4;
      p.alpha -= 0.012;
      if (p.alpha > 0) {
        alive = true;
        confCtx.save();
        confCtx.globalAlpha = p.alpha;
        confCtx.fillStyle = p.color;
        confCtx.fillRect(p.x, p.y, p.size, p.size);
        confCtx.restore();
      }
    });
    if (alive) requestAnimationFrame(update);
    else confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  }
  update();
}

async function cargarEstado() {
  try {
    const r = await fetch("/api/sorteo");
    const d = await r.json();
    participantes = d.participantes || [];
    dibujarRuleta();
  } catch(e) {}
}

es.addEventListener("sorteo_girar", async e => {
  const d = JSON.parse(e.data);
  await cargarEstado();
  animarGiro(d.indice_ganador, 6000, () => {
    document.getElementById("winnerName").textContent = d.ganador;
    document.getElementById("winnerPrize").textContent = d.premio;
    winnerCard.classList.add("show");
    setTimeout(() => {
      winnerCard.classList.remove("show");
    }, 12000);
  });
});

cargarEstado();
</script>
</body>
</html>
