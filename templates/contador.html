<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contador Regresivo - DB Legends & Stream</title>
  <script src="/static/flujo.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Orbitron:wght@700;900&family=Teko:wght@600;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Montserrat', sans-serif;
      user-select: none;
    }

    /* CONTENEDOR PRINCIPAL DEL CONTADOR */
    #festival-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px 32px 22px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(10, 15, 29, 0.94) 0%, rgba(18, 26, 48, 0.96) 50%, rgba(8, 12, 24, 0.95) 100%);
      border: 2px solid var(--ac-border, #ffb703);
      box-shadow: 0 0 25px rgba(255, 183, 3, 0.35), 0 12px 35px rgba(0, 0, 0, 0.85), inset 0 0 15px rgba(255, 183, 3, 0.15);
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center center;
    }

    /* EFECTO AURA KI */
    .ki-aura::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 20px;
      background: linear-gradient(90deg, #ffb703, #fb8500, #ff0055, #fb8500, #ffb703);
      background-size: 300% 300%;
      z-index: -1;
      opacity: 0.75;
      filter: blur(8px);
      animation: kiPulse 3s ease infinite;
    }

    @keyframes kiPulse {
      0% { background-position: 0% 50%; opacity: 0.55; }
      50% { background-position: 100% 50%; opacity: 0.9; filter: blur(12px); }
      100% { background-position: 0% 50%; opacity: 0.55; }
    }

    /* CABECERA: TÍTULO Y BADGE */
    .header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 14px;
      position: relative;
      width: 100%;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(90deg, #d90429 0%, #ef233c 100%);
      border: 1px solid #ff758f;
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 3px 14px;
      border-radius: 20px;
      margin-bottom: 5px;
      box-shadow: 0 2px 10px rgba(239, 35, 60, 0.6);
      text-shadow: 0 1px 2px #000;
    }

    .badge-icon {
      color: #ffea00;
      font-size: 13px;
      animation: starGlow 1.2s alternate infinite;
    }

    @keyframes starGlow {
      from { transform: scale(0.9); filter: drop-shadow(0 0 2px #ffea00); }
      to { transform: scale(1.2); filter: drop-shadow(0 0 8px #ffea00); }
    }

    .title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 28px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #fff275 30%, #ffb703 60%, #fb8500 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 14px rgba(255, 183, 3, 0.5));
      line-height: 1.1;
      margin-bottom: 2px;
    }

    .subtitle {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.15em;
      color: #94a3b8;
      text-transform: uppercase;
      text-shadow: 0 2px 4px #000;
    }

    /* GRID DEL CONTADOR */
    .grid {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* CARD INDIVIDUAL DE TIEMPO */
    .time-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 82px;
      padding: 8px 12px 6px;
      background: linear-gradient(180deg, #131d36 0%, #0d1424 100%);
      border: 1px solid rgba(255, 183, 3, 0.4);
      border-radius: 10px;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.15), 0 6px 14px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .time-card::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 100%);
      pointer-events: none;
    }

    .digit {
      font-family: 'Teko', 'Orbitron', sans-serif;
      font-size: 56px;
      font-weight: 700;
      line-height: 0.95;
      background: linear-gradient(180deg, #ffffff 0%, #fff3b0 35%, #ffd166 70%, #f77f00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 2px rgba(0,0,0,0.8));
      letter-spacing: 0.02em;
    }

    .label {
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #94a3b8;
      margin-top: 2px;
      text-shadow: 0 1px 2px #000;
    }

    /* SEPARADORES DE PUNTOS */
    .sep {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding-bottom: 12px;
    }

    .sep-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffb703;
      box-shadow: 0 0 8px #ffb703, 0 0 14px #fb8500;
      animation: dotPulse 1s ease-in-out infinite alternate;
    }

    @keyframes dotPulse {
      0% { opacity: 0.35; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); }
    }

    /* MODO ULTRA RARITY (TEMA AZUL / BLANCO / CELESTIAL) */
    #festival-wrap.estilo-ultra {
      border-color: #00f0ff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.35), 0 12px 35px rgba(0, 0, 0, 0.85), inset 0 0 15px rgba(0, 240, 255, 0.15);
    }
    #festival-wrap.estilo-ultra.ki-aura::before {
      background: linear-gradient(90deg, #00f0ff, #7000ff, #e0aaff, #00f0ff);
    }
    #festival-wrap.estilo-ultra .badge {
      background: linear-gradient(90deg, #7000ff 0%, #b5179e 100%);
      border-color: #e0aaff;
      box-shadow: 0 2px 10px rgba(181, 23, 158, 0.6);
    }
    #festival-wrap.estilo-ultra .title {
      background: linear-gradient(180deg, #ffffff 0%, #cbf3f0 30%, #48cae4 60%, #0077b6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.9)) drop-shadow(0 0 14px rgba(0, 240, 255, 0.5));
    }
    #festival-wrap.estilo-ultra .digit {
      background: linear-gradient(180deg, #ffffff 0%, #e0fbfc 35%, #90e0ef 70%, #00b4d8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    #festival-wrap.estilo-ultra .sep-dot {
      background: #00f0ff;
      box-shadow: 0 0 8px #00f0ff, 0 0 14px #7000ff;
    }
    #festival-wrap.estilo-ultra .time-card {
      border-color: rgba(0, 240, 255, 0.4);
    }

    /* MODO COMPACTO */
    #festival-wrap.estilo-compacto {
      flex-direction: row;
      gap: 22px;
      padding: 10px 22px;
      border-radius: 12px;
    }
    #festival-wrap.estilo-compacto .header {
      align-items: flex-start;
      text-align: left;
      margin-bottom: 0;
      width: auto;
    }
    #festival-wrap.estilo-compacto .title {
      font-size: 20px;
    }
    #festival-wrap.estilo-compacto .time-card {
      min-width: 62px;
      padding: 4px 8px 3px;
    }
    #festival-wrap.estilo-compacto .digit {
      font-size: 42px;
    }

    /* ESTADO FINAL: ¡STREAM EN VIVO / COMIENZA! */
    .evento-finalizado {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 20px;
      animation: finalBurst 0.6s ease-out forwards;
    }

    .final-badge {
      display: inline-block;
      background: linear-gradient(90deg, #ff0055, #ff5400, #ffb703);
      color: #fff;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.15em;
      padding: 6px 22px;
      border-radius: 30px;
      box-shadow: 0 0 20px #ff0055;
      text-shadow: 0 2px 4px #000;
      margin-bottom: 10px;
      animation: livePulse 1s infinite alternate;
    }

    .final-msg {
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 0.05em;
      background: linear-gradient(180deg, #ffffff 0%, #ffeb3b 50%, #ff9800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 183, 3, 0.8));
      text-transform: uppercase;
      max-width: 600px;
      line-height: 1.2;
    }

    @keyframes livePulse {
      0% { transform: scale(0.97); filter: brightness(1); }
      100% { transform: scale(1.05); filter: brightness(1.25); box-shadow: 0 0 30px #ff0055, 0 0 50px #ffb703; }
    }

    @keyframes finalBurst {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.06); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="festival-wrap" class="ki-aura">
    <!-- CABECERA -->
    <div class="header" id="header-box">
      <div class="badge" id="badge-el">
        <span class="badge-icon">★</span>
        <span id="badge-text">LEGENDS FESTIVAL</span>
        <span class="badge-icon">★</span>
      </div>
      <div class="title" id="title-el">LEGENDS FESTIVAL</div>
      <div class="subtitle" id="subtitle-el">DRAGON BALL LEGENDS</div>
    </div>

    <!-- CUADRÍCULA DE TIEMPO REGRESIVO -->
    <div class="grid" id="timer-grid">
      <!-- DÍAS -->
      <div class="time-card" id="card-days">
        <div class="digit" id="val-days">00</div>
        <div class="label">DÍAS</div>
      </div>

      <div class="sep" id="sep-1">
        <div class="sep-dot"></div>
        <div class="sep-dot"></div>
      </div>

      <!-- HORAS -->
      <div class="time-card" id="card-hours">
        <div class="digit" id="val-hours">00</div>
        <div class="label">HORAS</div>
      </div>

      <div class="sep" id="sep-2">
        <div class="sep-dot"></div>
        <div class="sep-dot"></div>
      </div>

      <!-- MINUTOS -->
      <div class="time-card" id="card-minutes">
        <div class="digit" id="val-minutes">00</div>
        <div class="label">MIN</div>
      </div>

      <div class="sep" id="sep-3">
        <div class="sep-dot"></div>
        <div class="sep-dot"></div>
      </div>

      <!-- SEGUNDOS -->
      <div class="time-card" id="card-seconds">
        <div class="digit" id="val-seconds">00</div>
        <div class="label">SEG</div>
      </div>
    </div>

    <!-- VISTA CUANDO LLEGA A CERO -->
    <div class="evento-finalizado" id="final-box" style="display: none;">
      <div class="final-badge">🔥 ¡EN VIVO AHORA! 🔥</div>
      <div class="final-msg" id="final-msg-el">¡EL STREAM HA COMENZADO!</div>
    </div>
  </div>

  <script>
    const wrap = document.getElementById("festival-wrap");
    const titleEl = document.getElementById("title-el");
    const subtitleEl = document.getElementById("subtitle-el");
    const badgeEl = document.getElementById("badge-el");
    const badgeText = document.getElementById("badge-text");
    const timerGrid = document.getElementById("timer-grid");
    const finalBox = document.getElementById("final-box");
    const finalMsgEl = document.getElementById("final-msg-el");

    const valDays = document.getElementById("val-days");
    const valHours = document.getElementById("val-hours");
    const valMinutes = document.getElementById("val-minutes");
    const valSeconds = document.getElementById("val-seconds");

    const cardDays = document.getElementById("card-days");
    const cardHours = document.getElementById("card-hours");
    const cardMinutes = document.getElementById("card-minutes");
    const cardSeconds = document.getElementById("card-seconds");

    const sep1 = document.getElementById("sep-1");
    const sep2 = document.getElementById("sep-2");
    const sep3 = document.getElementById("sep-3");

    // Parámetros de URL para sobrescribir directamente en OBS si se desea
    const params = new URLSearchParams(window.location.search);

    let config = {
      activa: true,
      badge: params.get("badge") || "LEGENDS FESTIVAL",
      titulo: params.get("titulo") || "LEGENDS FESTIVAL",
      subtitulo: params.get("subtitulo") || "DRAGON BALL LEGENDS",
      fecha_objetivo: params.get("fecha") || "2024-11-21T13:00",
      mensaje_final: params.get("mensaje_final") || "¡EL LEGENDS FESTIVAL HA COMENZADO!",
      estilo: params.get("estilo") || "festival",
      mostrar_dias: params.get("dias") !== "0",
      mostrar_horas: params.get("horas") !== "0",
      mostrar_segundos: params.get("segundos") !== "0",
      mostrar_aura: params.get("aura") !== "0",
      tamano: Number(params.get("tamano") || params.get("scale") || 100)
    };

    function pad2(n) {
      return String(Math.max(0, n)).padStart(2, "0");
    }

    function aplicarConfig(c) {
      if (!c) return;

      config.titulo = params.get("titulo") || c.titulo || config.titulo;
      config.subtitulo = params.get("subtitulo") || c.subtitulo || config.subtitulo;
      config.fecha_objetivo = params.get("fecha") || c.fecha_objetivo || config.fecha_objetivo;
      config.mensaje_final = params.get("mensaje_final") || c.mensaje_final || config.mensaje_final;
      config.estilo = params.get("estilo") || c.estilo || config.estilo;

      const badgeVal = params.get("badge") ?? c.badge;
      if (badgeVal !== undefined) {
        config.badge = badgeVal;
      }

      config.mostrar_dias = params.has("dias") ? (params.get("dias") !== "0") : (c.mostrar_dias !== false);
      config.mostrar_horas = params.has("horas") ? (params.get("horas") !== "0") : (c.mostrar_horas !== false);
      config.mostrar_segundos = params.has("segundos") ? (params.get("segundos") !== "0") : (c.mostrar_segundos !== false);
      config.mostrar_aura = params.has("aura") ? (params.get("aura") !== "0") : (c.mostrar_aura !== false);
      config.tamano = Number(params.get("tamano") || params.get("scale") || c.tamano || 100);

      // Aplicar textos
      titleEl.textContent = config.titulo;
      subtitleEl.textContent = config.subtitulo;
      finalMsgEl.textContent = config.mensaje_final;

      if (config.badge && config.badge.trim()) {
        badgeEl.style.display = "inline-flex";
        badgeText.textContent = config.badge.trim();
      } else {
        badgeEl.style.display = "none";
      }

      // Aplicar estilo y clases
      wrap.className = "";
      if (config.mostrar_aura) wrap.classList.add("ki-aura");
      if (config.estilo === "ultra") wrap.classList.add("estilo-ultra");
      else if (config.estilo === "compacto") wrap.classList.add("estilo-compacto");

      // Visibilidad de bloques de tiempo y separadores
      cardDays.style.display = config.mostrar_dias ? "flex" : "none";
      sep1.style.display = (config.mostrar_dias && config.mostrar_horas) ? "flex" : "none";

      cardHours.style.display = config.mostrar_horas ? "flex" : "none";
      sep2.style.display = config.mostrar_horas ? "flex" : "none";

      cardSeconds.style.display = config.mostrar_segundos ? "flex" : "none";
      sep3.style.display = config.mostrar_segundos ? "flex" : "none";

      // Escala visual
      const escala = Math.max(0.6, Math.min(1.8, config.tamano / 100));
      wrap.style.transform = `scale(${escala})`;
    }

    function actualizarCuenta() {
      if (!config.fecha_objetivo) return;

      const objetivo = new Date(config.fecha_objetivo).getTime();
      const ahora = Date.now();
      const diff = objetivo - ahora;

      if (diff <= 0) {
        // Evento alcanzado / en vivo
        timerGrid.style.display = "none";
        finalBox.style.display = "flex";
        return;
      }

      timerGrid.style.display = "flex";
      finalBox.style.display = "none";

      const totalSeg = Math.floor(diff / 1000);
      const dias = Math.floor(totalSeg / 86400);

      // Si los días están ocultos, las horas acumulan los días restantes
      const horas = config.mostrar_dias ? Math.floor((totalSeg % 86400) / 3600) : Math.floor(totalSeg / 3600);

      // Si las horas están ocultas (ej. temporizador de stream 5 o 10 min), los minutos acumulan el tiempo total
      const minutos = config.mostrar_horas ? Math.floor((totalSeg % 3600) / 60) : Math.floor(totalSeg / 60);
      const segundos = Math.floor(totalSeg % 60);

      valDays.textContent = pad2(dias);
      valHours.textContent = pad2(horas);
      valMinutes.textContent = pad2(minutos);
      valSeconds.textContent = pad2(segundos);
    }

    // Cargar config inicial desde el servidor
    async function cargar() {
      try {
        const res = await fetch("/api/contador", { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          if (data && data.cfg) aplicarConfig(data.cfg);
        }
      } catch (e) {
        aplicarConfig(config);
      }
      actualizarCuenta();
    }

    cargar();
    setInterval(actualizarCuenta, 1000);

    // Escuchar actualizaciones en tiempo real via SSE (Flujo)
    const flujo = new Flujo("contador");
    flujo.addEventListener("contador_cfg", (e) => {
      try {
        const d = JSON.parse(e.data);
        aplicarConfig(d);
        actualizarCuenta();
      } catch (err) {}
    });
  </script>
</body>
</html>
