<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script src="/static/flujo.js"></script>
<title>Top Streamloots VIP (OBS)</title>
<style>
  :root {
    --aura-1: #ffd45e;
    --aura-2: #ff9500;
    --aura-glow: rgba(255, 212, 94, 0.45);
    --border: rgba(255, 212, 94, 0.5);
    --bg: rgba(14, 20, 36, 0.94);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: #fff;
    user-select: none;
  }

  .contenedor {
    padding: 16px;
    display: inline-flex;
    align-items: center;
  }

  /* Tarjeta Holográfica VIP */
  .card-vip {
    position: relative;
    background: var(--bg);
    border: 2px solid var(--border);
    border-radius: 18px;
    padding: 12px 20px 12px 14px;
    display: inline-flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 12px 36px rgba(0,0,0,0.6), 0 0 25px var(--aura-glow);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Shimmer / Resplandor que pasa por la tarjeta */
  .card-vip::before {
    content: "";
    position: absolute;
    top: -50%;
    left: -60%;
    width: 40%;
    height: 200%;
    background: linear-gradient(
      60deg,
      transparent,
      rgba(255, 255, 255, 0.15),
      rgba(255, 255, 255, 0.35),
      transparent
    );
    transform: rotate(25deg);
    animation: brilloPase 4s infinite linear;
    pointer-events: none;
  }

  @keyframes brilloPase {
    0% { left: -70%; }
    30% { left: 140%; }
    100% { left: 140%; }
  }

  /* Cofre / Emblema Streamloots */
  .emblema-box {
    position: relative;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--aura-1), var(--aura-2));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 18px var(--aura-glow);
    flex-shrink: 0;
    animation: auraRespiracion 3s infinite ease-in-out;
  }

  @keyframes auraRespiracion {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px var(--aura-glow)); }
    50% { transform: scale(1.06); filter: drop-shadow(0 0 18px var(--aura-glow)); }
  }

  .emblema-box svg {
    width: 30px;
    height: 30px;
    fill: #1a1000;
  }

  /* Destellos de partículas */
  .sparkle {
    position: absolute;
    width: 8px;
    height: 8px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff, 0 0 18px var(--aura-1);
    pointer-events: none;
    animation: flotarSparkle 2s infinite ease-out;
  }

  @keyframes flotarSparkle {
    0% { opacity: 0; transform: scale(0.3) translateY(0); }
    50% { opacity: 1; transform: scale(1) translateY(-14px); }
    100% { opacity: 0; transform: scale(0.2) translateY(-28px); }
  }

  /* Contenido informativo */
  .cuerpo {
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-width: 220px;
  }

  /* Rango VIP */
  .rango-banner {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--aura-1);
    text-shadow: 0 0 8px var(--aura-glow);
  }

  /* Nombre de usuario VIP */
  .nombre-vip {
    font-size: 23px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Fila de insignias (Cofres + Dinero) */
  .badges-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 2px;
  }

  .badge-item {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 800;
    font-family: Consolas, monospace;
    color: #fff;
    white-space: nowrap;
  }

  .badge-item.cofres {
    background: rgba(0, 229, 255, 0.15);
    border-color: rgba(0, 229, 255, 0.4);
    color: #00e5ff;
  }

  .badge-item.dinero {
    background: rgba(83, 252, 24, 0.15);
    border-color: rgba(83, 252, 24, 0.4);
    color: #53fc18;
  }

  .mensaje-vip {
    font-size: 11px;
    color: #8da2c0;
    font-style: italic;
    margin-top: 1px;
  }

  /* Colores de Aura Temáticos */
  body.aura-dorado {
    --aura-1: #ffd45e;
    --aura-2: #ff9500;
    --aura-glow: rgba(255, 212, 94, 0.5);
    --border: rgba(255, 212, 94, 0.6);
  }

  body.aura-fuego {
    --aura-1: #ff3344;
    --aura-2: #ff8800;
    --aura-glow: rgba(255, 51, 68, 0.55);
    --border: rgba(255, 51, 68, 0.65);
  }

  body.aura-neon {
    --aura-1: #00f2fe;
    --aura-2: #4facfe;
    --aura-glow: rgba(0, 242, 254, 0.5);
    --border: rgba(0, 242, 254, 0.6);
  }

  body.aura-morado {
    --aura-1: #c084fc;
    --aura-2: #9333ea;
    --aura-glow: rgba(192, 132, 252, 0.5);
    --border: rgba(192, 132, 252, 0.6);
  }

  body.aura-esmeralda {
    --aura-1: #53fc18;
    --aura-2: #059669;
    --aura-glow: rgba(83, 252, 24, 0.5);
    --border: rgba(83, 252, 24, 0.6);
  }

  body.tamano-grande { transform: scale(1.25); transform-origin: top left; }
  body.tamano-compacto { transform: scale(0.85); transform-origin: top left; }
</style>
</head>
<body>

<div class="contenedor">
  <div class="card-vip" id="card">
    <div class="emblema-box" id="emblema">
      <!-- Icono Cofre Streamloots VIP -->
      <svg viewBox="0 0 24 24">
        <path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10-2h4v2h-4V4zm10 15H4V8h16v11z"/>
        <path d="M12 11c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
      <div class="sparkle" style="top:2px;right:4px;"></div>
      <div class="sparkle" style="bottom:4px;left:6px;animation-delay:1s;"></div>
    </div>

    <div class="cuerpo">
      <div class="rango-banner" id="txt-rango">👑 SUPREMO VIP STREAMLOOTS</div>
      <div class="nombre-vip" id="txt-usuario">NexusLegends</div>
      
      <div class="badges-row">
        <div class="badge-item cofres" id="box-cofres">
          <span>🎁</span><b id="txt-cofres">25 COFRES</b>
        </div>
        <div class="badge-item dinero" id="box-dinero">
          <span>💵</span><b id="txt-dinero">$45.00 USD</b>
        </div>
      </div>

      <div class="mensaje-vip" id="txt-mensaje">¡Máximo patrocinador del canal!</div>
    </div>
  </div>
</div>

<script>
const $ = i => document.getElementById(i);
const params = new URLSearchParams(location.search);

function aplicarAura(color) {
  document.body.className = document.body.className.replace(/aura-[\w-]+/g, "").trim();
  const c = color || "dorado";
  document.body.classList.add("aura-" + c);
}

function actualizarVIP(d) {
  if (!d) return;
  if (!d.activo && params.get("forzar") !== "1") {
    $("card").style.display = "none";
    return;
  }
  $("card").style.display = "inline-flex";

  const u = (d.usuario || "NexusLegends").trim();
  $("txt-usuario").textContent = u.startsWith("@") ? u : ("@" + u);
  $("txt-rango").textContent = d.rango || "👑 SUPREMO VIP";

  // Cofres
  const cof = parseInt(d.cofres) || 0;
  if (cof > 0) {
    $("txt-cofres").textContent = cof + " COFRE" + (cof > 1 ? "S" : "");
    $("box-cofres").style.display = "inline-flex";
  } else {
    $("box-cofres").style.display = "none";
  }

  // Dinero
  const din = (d.dinero || "").trim();
  if (din) {
    $("txt-dinero").textContent = din;
    $("box-dinero").style.display = "inline-flex";
  } else {
    $("box-dinero").style.display = "none";
  }

  // Mensaje
  const msg = (d.mensaje || "").trim();
  if (msg) {
    $("txt-mensaje").textContent = msg;
    $("txt-mensaje").style.display = "block";
  } else {
    $("txt-mensaje").style.display = "none";
  }

  aplicarAura(params.get("aura") || d.color_aura || "dorado");
}

async function cargar() {
  try {
    const res = await fetch("/api/tops", { cache: "no-store" });
    if (res.ok) {
      const data = await res.json();
      actualizarVIP(data.top_streamloots);
    }
  } catch(e) {}
}

if (params.get("tamano")) document.body.classList.add("tamano-" + params.get("tamano"));
if (params.get("aura")) aplicarAura(params.get("aura"));

const flujo = new Flujo("top_streamloots_obs", 3000);
flujo.addEventListener("tops_cfg", e => {
  try {
    const d = JSON.parse(e.data);
    actualizarVIP(d.top_streamloots);
  } catch(err) {}
});

flujo.onopen = cargar;
cargar();
setInterval(cargar, 5000);
</script>
</body>
</html>
